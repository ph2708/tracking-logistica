services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracking_logistica_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8080:8000"
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - maquigeral_network

  mysql:
    image: mysql:8.0
    container_name: tracking_logistica_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tracking_dashboard
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:33088:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - maquigeral_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
    driver: local

networks:
  maquigeral_network:
    driver: bridge
